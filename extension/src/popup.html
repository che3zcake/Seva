<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px; margin: 0; padding: 16px;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #16211e; background: #faf9f6;
      }
      h1 { font: 600 15px/1.3 inherit; margin: 0 0 2px; }
      p { margin: 0; color: #5b6b66; font-size: 13px; }
      .status { display: flex; align-items: center; gap: 8px; margin: 14px 0; padding: 10px;
                border-radius: 10px; background: #fff; border: 1px solid #e3e1da; }
      .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      .on { background: #0f7b5f; } .off { background: #a33325; }
      label { display: block; font-size: 12px; font-weight: 600; margin: 14px 0 5px; }
      input { width: 100%; padding: 9px 10px; border: 1px solid #cfccc2; border-radius: 9px;
              font: inherit; background: #fff; }
      button { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 9px;
               background: #0f5c4e; color: #fff; font: 500 14px inherit; cursor: pointer; }
      button:hover { background: #0b463b; }
      .note { margin-top: 14px; font-size: 12px; color: #5b6b66; }
      .saved { color: #0f7b5f; font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Seva</h1>
    <p>Know what you need before you start.</p>

    <div class="status">
      <span class="dot off" id="dot"></span>
      <span id="statusText">Not linked to a checklist yet</span>
    </div>

    <label for="api">Seva address</label>
    <input id="api" type="url" placeholder="http://localhost:4000" />
    <button id="save">Save</button>
    <div class="saved" id="saved" hidden>Saved.</div>

    <p class="note">
      This extension reads the document names shown on a page to work out what the form asks for.
      That happens in your browser, and nothing is sent until you tap “Check my documents”.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
