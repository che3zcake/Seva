# One free Render web service runs the whole thing: the API also serves the
# built client (see server/src/app.ts), so there is a single public URL and no
# CORS to configure.
services:
  - type: web
    name: seva
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Optional. Without it the deterministic explanations answer instead,
      # and the whole journey still works.
      - key: OPENAI_API_KEY
        sync: false
